<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTP Phase Offset Telemetry</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .header-bar {
            background: #2a2a2a;
            border-bottom: 2px solid #4CAF50;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #4CAF50;
            flex-shrink: 0;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 12px;
            background: #1a1a1a;
            font-size: 0.85em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }

        .header-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.85em;
            margin-left: auto;
        }

        .header-info-item {
            display: flex;
            gap: 6px;
        }

        .header-info-label {
            color: #999;
        }

        .header-info-value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-reset {
            background: #f44336;
            color: white;
        }

        .btn-download {
            background: #2196F3;
            color: white;
        }

        .container {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .stats-table {
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .stats-table h2 {
            font-size: 1.1em;
            padding: 15px;
            color: #4CAF50;
            border-bottom: 1px solid #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 15px;
            text-align: right;
            border-bottom: 1px solid #333;
        }

        th:first-child, td:first-child {
            text-align: left;
        }

        th {
            color: #999;
            font-weight: 600;
            font-size: 0.9em;
        }

        td {
            font-family: 'Courier New', monospace;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #333;
        }

        .chart-card h3 {
            font-size: 1em;
            margin-bottom: 15px;
            color: #4CAF50;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }

        .last-update {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 0.85em;
        }

        @media (max-width: 1200px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-info {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="header-title">PTP Phase Offset Telemetry</div>
        <div class="header-status">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Connecting...</span>
        </div>
        <div class="header-info" id="header-info">
            <div class="header-info-item">
                <span class="header-info-label">GPS:</span>
                <span class="header-info-value" id="gps-error">--</span>
            </div>
            <div class="header-info-item">
                <span class="header-info-label">Batches:</span>
                <span class="header-info-value" id="batches">0</span>
            </div>
            <div class="header-info-item">
                <span class="header-info-label">Dropped:</span>
                <span class="header-info-value" id="dropped">0</span>
            </div>
            <div class="header-info-item">
                <span class="header-info-label">Outliers:</span>
                <span class="header-info-value" id="outliers">0</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-download" onclick="downloadData()">Download CSV</button>
            <button class="btn btn-reset" onclick="resetStats()">Reset</button>
        </div>
    </div>

    <div class="container">
        <div id="content">
            <div class="no-data">Waiting for data from Pico W...</div>
        </div>
    </div>

    <script>
        let ws = null;
        let charts = {};

        const chartColors = {
            primary: '#4CAF50',
            secondary: '#2196F3',
            warning: '#ff9800',
            danger: '#f44336',
            grid: '#333',
            text: '#999'
        };

        const defaultChartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,  // Disable animation for better performance
            plugins: {
                legend: {
                    display: false
                },
                decimation: {
                    enabled: false  // Show all data points
                }
            },
            scales: {
                x: {
                    grid: {
                        color: chartColors.grid
                    },
                    ticks: {
                        color: chartColors.text
                    }
                },
                y: {
                    grid: {
                        color: chartColors.grid
                    },
                    ticks: {
                        color: chartColors.text
                    }
                }
            }
        };

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus(true);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus(false);
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = (event) => {
                const stats = JSON.parse(event.data);
                updateUI(stats);
            };
        }

        function updateStatus(connected) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');

            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }

        function formatNumber(num, decimals = 1) {
            if (typeof num !== 'number' || !isFinite(num)) return '--';
            return num.toFixed(decimals);
        }

        function formatInteger(num) {
            if (typeof num !== 'number') return '--';
            return num.toLocaleString();
        }

        function updateUI(stats) {
            if (stats.sample_count === 0) return;

            // Update header info
            const gpsError = stats.last_crystal_err;
            const gpsPPM = gpsError / 1000000.0;
            document.getElementById('gps-error').textContent =
                `${gpsError > 0 ? '+' : ''}${gpsError} ns (${formatNumber(gpsPPM, 3)} ppm)`;
            document.getElementById('batches').textContent = formatInteger(stats.batches_received);
            document.getElementById('dropped').textContent = stats.buffer_dropped;
            document.getElementById('outliers').textContent = stats.outliers_filtered || 0;

            // Update main content
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="stats-table">
                    <h2>Phase Offset Statistics</h2>
                    <table>
                        <thead>
                            <tr>
                                <th></th>
                                <th>All-Time</th>
                                <th>5 Min</th>
                                <th>15 Min</th>
                                <th>30 Min</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Samples</td>
                                <td>${formatInteger(stats.sample_count)}</td>
                                <td>${formatInteger(stats.window_5min?.count || 0)}</td>
                                <td>${formatInteger(stats.window_15min?.count || 0)}</td>
                                <td>${formatInteger(stats.window_30min?.count || 0)}</td>
                            </tr>
                            <tr>
                                <td>Mean (ns)</td>
                                <td>${formatNumber(stats.mean, 1)}</td>
                                <td>${formatNumber(stats.window_5min?.mean, 1)}</td>
                                <td>${formatNumber(stats.window_15min?.mean, 1)}</td>
                                <td>${formatNumber(stats.window_30min?.mean, 1)}</td>
                            </tr>
                            <tr>
                                <td>Std Dev (ns)</td>
                                <td>${formatNumber(stats.stddev, 1)}</td>
                                <td>${formatNumber(stats.window_5min?.stddev, 1)}</td>
                                <td>${formatNumber(stats.window_15min?.stddev, 1)}</td>
                                <td>${formatNumber(stats.window_30min?.stddev, 1)}</td>
                            </tr>
                            <tr>
                                <td>Min (ns)</td>
                                <td>${formatNumber(stats.min, 1)}</td>
                                <td>${formatNumber(stats.window_5min?.min, 1)}</td>
                                <td>${formatNumber(stats.window_15min?.min, 1)}</td>
                                <td>${formatNumber(stats.window_30min?.min, 1)}</td>
                            </tr>
                            <tr>
                                <td>Max (ns)</td>
                                <td>${formatNumber(stats.max, 1)}</td>
                                <td>${formatNumber(stats.window_5min?.max, 1)}</td>
                                <td>${formatNumber(stats.window_15min?.max, 1)}</td>
                                <td>${formatNumber(stats.window_30min?.max, 1)}</td>
                            </tr>
                            <tr>
                                <td>Range (ns)</td>
                                <td>${formatNumber(stats.max - stats.min, 1)}</td>
                                <td>${formatNumber((stats.window_5min?.max || 0) - (stats.window_5min?.min || 0), 1)}</td>
                                <td>${formatNumber((stats.window_15min?.max || 0) - (stats.window_15min?.min || 0), 1)}</td>
                                <td>${formatNumber((stats.window_30min?.max || 0) - (stats.window_30min?.min || 0), 1)}</td>
                            </tr>
                            <tr>
                                <td>GM First</td>
                                <td>${formatInteger(stats.gm_first_count)}</td>
                                <td>--</td>
                                <td>--</td>
                                <td>--</td>
                            </tr>
                            <tr>
                                <td>Slave First</td>
                                <td>${formatInteger(stats.slave_first_count)}</td>
                                <td>--</td>
                                <td>--</td>
                                <td>--</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="chart-grid">
                    <div class="chart-card">
                        <h3>Time Interval Error (TIE)</h3>
                        <div class="chart-container">
                            <canvas id="tie-chart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <h3>Phase Offset Histogram</h3>
                        <div class="chart-container">
                            <canvas id="histogram-chart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <h3>Maximum Time Interval Error (MTIE)</h3>
                        <div class="chart-container">
                            <canvas id="mtie-chart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <h3>Allan Deviation</h3>
                        <div class="chart-container">
                            <canvas id="allan-chart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="last-update">
                    Last update: ${timeSince(stats.last_update)}
                </div>
            `;

            // Update charts
            updateTIEChart(stats.tie_data || []);
            updateHistogramChart(stats.histogram);
            updateMTIEChart(stats.mtie_data || []);
            updateAllanChart(stats.allan_data || []);
        }

        function updateTIEChart(data) {
            const ctx = document.getElementById('tie-chart');
            if (!ctx) return;

            if (charts.tie) {
                charts.tie.destroy();
            }

            if (data.length === 0) {
                ctx.parentElement.innerHTML = '<div class="no-data" style="padding: 20px;">Waiting for data...</div>';
                return;
            }

            // Separate normal points and outliers for different visualization
            const normalPoints = data.filter(d => !d.is_outlier).map(d => ({x: d.time, y: d.phase_ns}));
            const outlierPoints = data.filter(d => d.is_outlier).map(d => ({x: d.time, y: d.phase_ns}));

            // Calculate Y-axis range based on NORMAL data only (ignore outliers for scaling)
            let yMin = 0, yMax = 200000; // Default 0-200µs
            if (normalPoints.length > 0) {
                const normalValues = normalPoints.map(p => p.y);
                const mean = normalValues.reduce((a, b) => a + b, 0) / normalValues.length;

                // Calculate standard deviation
                const variance = normalValues.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / normalValues.length;
                const stdDev = Math.sqrt(variance);

                // Set Y-axis to mean ± 4 standard deviations (captures 99.99% of normal data)
                yMin = Math.max(0, mean - 4 * stdDev);
                yMax = mean + 4 * stdDev;

                // Add 10% margin for readability
                const margin = (yMax - yMin) * 0.1;
                yMin = Math.max(0, yMin - margin);
                yMax = yMax + margin;
            }

            const datasets = [
                {
                    label: 'Phase Offset',
                    data: normalPoints,
                    borderColor: chartColors.primary,
                    backgroundColor: chartColors.primary + '20',
                    borderWidth: 1,
                    pointRadius: 1,
                    pointBackgroundColor: chartColors.primary,
                    fill: true,
                    tension: 0,
                    order: 2
                }
            ];

            // Add outliers as separate dataset if any exist
            // Outliers beyond Y-axis range will be clipped but still visible as points at edge
            if (outlierPoints.length > 0) {
                datasets.push({
                    label: `Outliers (${outlierPoints.length}, clipped)`,
                    data: outlierPoints,
                    borderColor: chartColors.danger,
                    backgroundColor: chartColors.danger,
                    borderWidth: 0,
                    pointRadius: 4,
                    pointBackgroundColor: chartColors.danger,
                    pointBorderColor: chartColors.danger,
                    pointStyle: 'triangle',
                    fill: false,
                    showLine: false,
                    order: 1
                });
            }

            charts.tie = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    ...defaultChartOptions,
                    plugins: {
                        legend: {
                            display: outlierPoints.length > 0,
                            position: 'top',
                            labels: {
                                color: chartColors.text,
                                padding: 10,
                                font: { size: 10 },
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    const value = context.parsed.y;
                                    const time = context.parsed.x;

                                    // Show if value is clipped
                                    if (value > yMax || value < yMin) {
                                        return `${label}: ${(value/1000).toFixed(1)} µs (CLIPPED - actual: ${(value/1000).toFixed(0)} µs)`;
                                    }
                                    return `${label}: ${(value/1000).toFixed(2)} µs`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            title: {
                                display: true,
                                text: 'Time (seconds)',
                                color: chartColors.text
                            },
                            grid: { color: chartColors.grid },
                            ticks: { color: chartColors.text }
                        },
                        y: {
                            type: 'linear',
                            min: yMin,
                            max: yMax,
                            title: {
                                display: true,
                                text: 'Phase Offset (ns) - Auto-scaled to normal data',
                                color: chartColors.text
                            },
                            grid: { color: chartColors.grid },
                            ticks: { color: chartColors.text }
                        }
                    }
                }
            });
        }

        function updateHistogramChart(histData) {
            const ctx = document.getElementById('histogram-chart');
            if (!ctx) return;

            if (charts.histogram) {
                charts.histogram.destroy();
            }

            if (!histData || !histData.bins || histData.bins.length === 0) {
                ctx.parentElement.innerHTML = '<div class="no-data" style="padding: 20px;">Waiting for data...</div>';
                return;
            }

            // Build labels and data arrays
            const labels = [];
            const values = [];

            for (let i = 0; i < histData.bins.length; i++) {
                const binStart = histData.min_val + (i * histData.bin_size);
                labels.push(binStart.toFixed(0));
                values.push(histData.bins[i]);
            }

            charts.histogram = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: chartColors.secondary,
                        borderColor: chartColors.secondary,
                        borderWidth: 1
                    }]
                },
                options: {
                    ...defaultChartOptions,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Phase Offset (ns)',
                                color: chartColors.text
                            },
                            grid: { color: chartColors.grid },
                            ticks: {
                                color: chartColors.text,
                                maxRotation: 45,
                                minRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 20
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Count',
                                color: chartColors.text
                            },
                            grid: { color: chartColors.grid },
                            ticks: { color: chartColors.text }
                        }
                    }
                }
            });
        }

        function updateMTIEChart(data) {
            const ctx = document.getElementById('mtie-chart');
            if (!ctx) return;

            if (charts.mtie) {
                charts.mtie.destroy();
            }

            if (data.length === 0) {
                ctx.parentElement.innerHTML = '<div class="no-data" style="padding: 20px;">Need more data (min 1s)</div>';
                return;
            }

            // ITU-T MTIE Masks (nanoseconds)
            // G.8272 PRTC-A (Primary Reference Time Clock Class A)
            const g8272_prtc_a = [
                {x: 1, y: 100},
                {x: 1000, y: 100}
            ];

            // G.8272 PRTC-B (Primary Reference Time Clock Class B)
            const g8272_prtc_b = [
                {x: 1, y: 1000},
                {x: 1000, y: 1000}
            ];

            // G.8273.2 Class C (T-BC/T-TSC for 4G/5G)
            const g8273_2_c = [
                {x: 0.1, y: 30},
                {x: 1, y: 30},
                {x: 100, y: 100},
                {x: 1000, y: 275}
            ];

            // G.8273.2 Class D (less stringent)
            const g8273_2_d = [
                {x: 0.1, y: 50},
                {x: 1, y: 50},
                {x: 100, y: 150},
                {x: 1000, y: 400}
            ];

            const datasets = [
                {
                    label: 'Measured MTIE',
                    data: data.map(d => ({x: d.tau, y: d.mtie})),
                    borderColor: chartColors.warning,
                    backgroundColor: chartColors.warning,
                    borderWidth: 3,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    fill: false
                },
                {
                    label: 'ITU-T G.8272 PRTC-A',
                    data: g8272_prtc_a,
                    borderColor: '#00ff00',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'ITU-T G.8272 PRTC-B',
                    data: g8272_prtc_b,
                    borderColor: '#00cc00',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'ITU-T G.8273.2 Class C',
                    data: g8273_2_c,
                    borderColor: '#ffff00',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'ITU-T G.8273.2 Class D',
                    data: g8273_2_d,
                    borderColor: '#ff9900',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                }
            ];

            charts.mtie = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    ...defaultChartOptions,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                color: chartColors.text,
                                padding: 10,
                                font: {
                                    size: 10
                                },
                                usePointStyle: true
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'logarithmic',
                            title: {
                                display: true,
                                text: 'Observation Interval τ (seconds)',
                                color: chartColors.text
                            },
                            grid: { color: chartColors.grid },
                            ticks: {
                                color: chartColors.text,
                                callback: function(value, index, ticks) {
                                    // Only show ticks that are actual data points
                                    const tau = data.map(d => d.tau);
                                    return tau.includes(value) ? value : '';
                                }
                            }
                        },
                        y: {
                            type: 'logarithmic',
                            title: {
                                display: true,
                                text: 'MTIE (ns)',
                                color: chartColors.text
                            },
                            grid: { color: chartColors.grid },
                            ticks: { color: chartColors.text }
                        }
                    }
                }
            });
        }

        function updateAllanChart(data) {
            const ctx = document.getElementById('allan-chart');
            if (!ctx) return;

            if (charts.allan) {
                charts.allan.destroy();
            }

            if (data.length === 0) {
                ctx.parentElement.innerHTML = '<div class="no-data" style="padding: 20px;">Need more data (min 3s)</div>';
                return;
            }

            charts.allan = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        data: data.map(d => ({x: d.tau, y: d.adev})),
                        borderColor: chartColors.danger,
                        backgroundColor: chartColors.danger,
                        borderWidth: 3,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: false
                    }]
                },
                options: {
                    ...defaultChartOptions,
                    scales: {
                        x: {
                            type: 'logarithmic',
                            title: {
                                display: true,
                                text: 'Averaging Time τ (seconds)',
                                color: chartColors.text
                            },
                            grid: { color: chartColors.grid },
                            ticks: {
                                color: chartColors.text,
                                callback: function(value, index, ticks) {
                                    // Only show ticks that are actual data points
                                    const tau = data.map(d => d.tau);
                                    return tau.includes(value) ? value : '';
                                }
                            }
                        },
                        y: {
                            type: 'logarithmic',
                            title: {
                                display: true,
                                text: 'Allan Deviation (ns)',
                                color: chartColors.text
                            },
                            grid: { color: chartColors.grid },
                            ticks: { color: chartColors.text }
                        }
                    }
                }
            });
        }

        function timeSince(date) {
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            if (seconds < 2) return 'just now';
            if (seconds < 60) return `${seconds}s ago`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            return `${hours}h ago`;
        }

        function resetStats() {
            if (!confirm('Clear all statistics and start fresh? This cannot be undone.')) {
                return;
            }

            fetch('/api/reset', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log('Stats reset:', data);
                    location.reload();  // Reload page to show empty state
                })
                .catch(error => {
                    console.error('Reset failed:', error);
                    alert('Failed to reset statistics');
                });
        }

        function downloadData() {
            window.location.href = '/api/download';
        }

        // Connect on load
        connect();
    </script>
</body>
</html>
